services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes: !override
      - type: bind
        source: ./backend/.env
        target: /var/www/.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      SESSION_SECURE_COOKIE: "true"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    restart: unless-stopped
    ports: !override []
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    restart: unless-stopped
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_FILE:?Set TLS_CERTIFICATE_FILE to a trusted full-chain PEM certificate}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_FILE:?Set TLS_PRIVATE_KEY_FILE to its private key}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
